<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ivanov Analytics</title><link rel="stylesheet" href="./styles.css"></head><body>
<section id="loginScreen" class="login-screen"><form id="loginForm" class="login-card"><div class="brand">IVANOV <span>ANALYTICS</span></div><h1>Лично табло</h1><p>Входът е разрешен само за собственика.</p><label>Имейл<input id="email" type="email" required></label><label>Парола<input id="password" type="password" required></label><button type="submit">Вход</button><div id="loginError" class="error"></div></form></section>
<div id="app" class="app hidden"><aside id="sidebar" class="sidebar"><div class="brand">IVANOV <span>ANALYTICS</span></div><nav class="nav">
<button data-view="summary" class="active">▦ Обобщение</button><button data-view="visits">◉ Посещения</button><button data-view="results">☎ Резултати</button><button data-view="pages">▤ Страници</button><button data-view="sources">↗ Източници</button><button data-view="audience">◎ Аудитория</button><button data-view="behavior">⌁ Поведение</button><button data-view="compare">⇄ Сравнения</button><button data-view="status">● Системен статус</button><button data-view="settings">⚙ Настройки</button></nav></aside>
<main class="content"><header class="topbar"><button id="mobileMenu" class="ghost mobile-menu">☰</button><select id="siteFilter"><option value="all">Всички сайтове</option><option value="sofia">София</option><option value="lom">Лом</option><option value="montana">Монтана</option><option value="lom-en">Лом EN</option><option value="lom-de">Лом DE</option></select><select id="periodFilter"><option value="today">Днес</option><option value="yesterday">Вчера</option><option value="7d" selected>7 дни</option><option value="30d">30 дни</option><option value="month">Този месец</option><option value="custom">Избран период</option></select><input id="dateFrom" type="date" class="hidden"><input id="dateTo" type="date" class="hidden"><button id="refreshBtn" class="ghost">Обнови</button><span class="spacer"></span><span id="userEmail" class="muted"></span><button id="logoutBtn" class="ghost">Изход</button></header><section id="view" class="view"></section></main></div>
<script type="module" src="./dashboard.js"></script></body></html>
