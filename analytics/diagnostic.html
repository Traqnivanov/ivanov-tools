<!doctype html>
<html lang="bg">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ivanov Analytics Diagnostic</title></head>
<body><pre id="out">Зареждане…</pre><script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import { getFirestore, collection, getDocs, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
import { firebaseConfig, OWNER_UID } from './firebase-config.js?v=20260818-5';
const out=document.querySelector('#out');
const app=getApps()[0]||initializeApp(firebaseConfig);
const auth=getAuth(app); const db=getFirestore(app);
onAuthStateChanged(auth,async user=>{
  if(!user){out.textContent='NO_AUTH';return}
  if(user.uid!==OWNER_UID){out.textContent='WRONG_USER';return}
  try{
    const snap=await getDocs(query(collection(db,'analytics_events'),orderBy('timestamp','desc'),limit(5)));
    const rows=snap.docs.map(d=>{const x=d.data();return {id:d.id,timestamp:x.timestamp?.toDate?.()?.toISOString?.()||null,eventType:x.eventType||'',site:x.site||'',pagePath:x.pagePath||'',trackerVersion:x.trackerVersion||''}});
    out.textContent=JSON.stringify({now:new Date().toISOString(),count:rows.length,rows},null,2);
  }catch(e){out.textContent='ERROR '+(e.code||'')+' '+e.message}
});
</script></body></html>
